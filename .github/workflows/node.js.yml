name: Angular Build

# {1}
on:
  push:
    branches: 
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # {2}
      - name: Checkout the source code
        uses: actions/checkout@v3

      # {3}
      - name: Setup Node.js $
        uses: actions/setup-node@v3
        with:
          node-version: $
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # {4}
      - name: Install dependencies
      - working-directory: .
        run: npm ci
        
      # {5}
      - name: Run tests
      - working-directory: .
        run: npm run test:ci
        
      # {6}
      - name: Build
      - working-directory: .
        run: npm run build --prod
